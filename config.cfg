# =============================================
# SwiftNNI System Configuration
# ==============================================

# --- Networking ---
SERVER_IP=127.0.0.1
SCHEDULER_PORT=8000
MAX_CONN=50

# --- Resource Management ---
TOTAL_CORES=192
MAX_PREPROC_CONCURRENCY=5

# --- Port Management ---
BASE_PORT=47100
PORT_RANGE=900
PRE_BASE_PORT=46000

# --- Scheduling Logic ---
SCHEDULER_MODE=SJF
# PriorityScore = Expected_Inf_Time_ms - (Wait_Time_ms * AGING_FACTOR)
AGING_FACTOR=0.5

# --- Dynamic Watchdog Factors ---
# Timeout = (Expected_Time_from_Profile * FACTOR). 
# Example: If inf_ms is 3000ms and factor is 2.0, timeout is 6 seconds.
TIMEOUT_FACTOR_PRE=2.0
TIMEOUT_FACTOR_INF=2.0
# Safety floor: minimum timeout in seconds regardless of factor
MIN_TIMEOUT_S=10

# --- Command Templates ---
# Online Inference Server (Mode 0)
SERVER_CMD_TEMPLATE=./build/benchmark-{MODEL} 0 {SERVER_IP} {PORT} {BATCH} {FILE}
# Pre-processor (Mode 2)
PREPROC_CMD_TEMPLATE=./build/benchmark-{MODEL} 2 127.0.0.1 {PORT} {BATCH} {FILE}

# --- Paths ---
SNNI_DIR=../../shark
PROFILE_FILE=profile.cfg
LOG_FILE=logs/scheduler_log.csv