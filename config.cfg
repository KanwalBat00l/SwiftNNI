# =============================================================================
# Kairos System Configuration
# =============================================================================

# --- Networking ---
# The Ethernet IP of this node (as seen by clients)
SERVER_IP=172.18.59.136
SCHEDULER_PORT=8000
# Max pending TCP connections in OS backlog
MAX_CONN=50

# --- Resource Management ---
ENABLE_CORE_PINNING=true

# Total cores allocated via Slurm (e.g., --cpus-per-task)
TOTAL_CORES=24
# Cores dedicated to Kairos (Server, Logger, Dispatcher threads)
SYSTEM_RESERVED_CORES=2
# Concurrent pre-processing limit (Each Dealer gets 1 dedicated core)
MAX_PREPROC_CONCURRENCY=5


# --- Port Management ---
# Range for Online Inference Servers
BASE_PORT=47100
PORT_RANGE=900
# Starting port for Dealers (Mode 2)
PRE_BASE_PORT=46000

# --- Scheduling & SLO Logic ---
# Options: FCFS, SJF, EDF, LST, SA, DQN, CUSTOM
SCHEDULER_MODE=FCFS
# K-Factor for admission control: SLO >= (Expected_Inf * K)
DEFAULT_SLO_K_FACTOR=2
VFT_SAFETY_MARGIN= 1.2
# Penalty reduction for waiting jobs in SJF
AGING_FACTOR=0.5

# --- SA Scheduler Parameters ---
# Initial temperature for simulated annealing
SA_INITIAL_TEMP=100.0
# Geometric cooling rate (0 < rate < 1)
SA_COOLING_RATE=0.92
# Maximum SA iterations per sortQueue call
SA_MAX_ITERATIONS=80
# Full-queue visibility depth (C-18: optimize entire queue up to this depth)
SA_WINDOW_SIZE=100
# Minimum interval between event-triggered re-optimizations (C-17)
SA_MIN_RETRIGGER_MS=50

# --- Differentiated EWMA (C-05) ---
EWMA_ALPHA_PRE=0.2
EWMA_ALPHA_ON=0.4

# --- Memory Safety (C-23) ---
# Fraction of total RAM before admission throttle
MEM_SAFETY_THRESHOLD=0.90
# Hard memory reserve in GB
MEM_RESERVE_GB=2.0

# --- Config-driven normalization (C-11) ---
# Set to 0 for auto-detect from SystemMonitor
TOTAL_MEMORY_MB=0

# --- Dynamic Watchdog (C-22) ---
# Global cap for lease timeout in seconds
MAX_LEASE_TIMEOUT_S=1800

# --- Profile Checkpointing (C-25) ---
PROFILE_CHECKPOINT_JOBS=10
PROFILE_CHECKPOINT_SECS=30

# --- Command Templates ---
# {CORE_RANGE} is dynamically replaced with physical IDs (e.g. "10,11,12")
SERVER_CMD_TEMPLATE=cd {SNNI_DIR} && taskset -c {CORE_RANGE} ./build/benchmark-{MODEL} 0 {SERVER_IP} {PORT} {BATCH} {FILE}
# Dealers run on the Dealer-Core-Pool
PREPROC_CMD_TEMPLATE=cd {SNNI_DIR} && taskset -c {CORE_RANGE} ./build/benchmark-{MODEL} 2 127.0.0.1 {PORT} {BATCH} {FILE}

# --- Paths ---
SNNI_DIR=../shark
LOG_FILE=logs/scheduler_log.csv
SYS_FILE=logs/system_stats.csv
DYNAMIC_PROFILE_FILE=logs/profile_dynamic.cfg

DQN_WEIGHTS_PATH=../models/dqn_weights.bin

# --- FU-8: Multi-objective DQN Reward Weights ---
# R = (w1 * R_SLO) + (w2 * R_TAT) + (w3 * R_Energy)
DQN_REWARD_W1_SLO=10.0
DQN_REWARD_W2_TAT=1.0
DQN_REWARD_W3_ENERGY=0.1

# --- Time-Series Memory Telemetry (Q-8) ---
# Polling interval in ms (range: 50-1000, default: 100)
TELEMETRY_SAMPLE_RATE_MS=100
# Toggle memory time-series logging
ENABLE_TIME_SERIES_LOGGING=true
# Output file for memory trace
MEM_TRACE_FILE=logs/mem_trace.csv

# --- Negotiation Parameters (Q-3) ---
# Theta threshold for triggering negotiation (θ_c >= threshold)
THETA_NEGOTIATION_THRESHOLD=1.5
# Client response timeout for negotiation in ms
NEGOTIATION_TIMEOUT_MS=200

# --- TTFR Handshake (Q-2/FU-9) ---
# FU-9: Per-network-type TTFR baselines (ms). θ_est = measured_rtt / baseline(net_type)
TTFR_BASELINE_RTT_MS=5.0
TTFR_BASELINE_LAN_MS=5.0
TTFR_BASELINE_WIFI_MS=20.0
TTFR_BASELINE_5G_MS=40.0
TTFR_BASELINE_WAN_MS=100.0

# --- Tier 2 Static SLO Filter ---
# SLO must be >= SLO_FACTOR_TIER2 × E_{i,c} where E_{i,c} = e_pre + θ_c × e_on
SLO_FACTOR_TIER2=1.5

# --- n_alt Model Mapping (C-04/FU-6) ---
# FU-6: Family-based format — batch size is preserved from original request
# Format: "model_family:alt1_family,alt2_family;model2_family:alt3_family"
# Per contract: AlexNet→SimC2/HiNet, VGG16→HiNet/ResNet50/SimC2, D4/ResNet50→SimC1/SimC2
N_ALT_MAP=alexnet:simc2,hinet;vgg16:hinet,resnet50,simc2;d4:simc1,simc2;resnet50:simc1,simc2

# --- FU-15: Linear Power Model Fallback ---
# Used when RAPL=0 and Slurm=0: Energy = (P_idle + p_J * P_dynamic_per_core) * TAT
ENERGY_IDLE_POWER_W=100.0
ENERGY_DYNAMIC_POWER_PER_CORE_W=10.0